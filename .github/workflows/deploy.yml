name: Publicar no GitHub Pages

# Testa, compila e envia o app pronto para a branch gh-pages,
# que o GitHub Pages publica em https://<usuario>.github.io/italiano-b1/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Opcional: configuração pública do login (Settings → Secrets and variables → Actions → Variables).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PAYWALL: ${{ vars.VITE_PAYWALL }}
          VITE_STRIPE_LINK_MONTHLY: ${{ vars.VITE_STRIPE_LINK_MONTHLY }}
          VITE_STRIPE_LINK_YEARLY: ${{ vars.VITE_STRIPE_LINK_YEARLY }}
          VITE_PRICE_MONTHLY: ${{ vars.VITE_PRICE_MONTHLY }}
          VITE_PRICE_YEARLY: ${{ vars.VITE_PRICE_YEARLY }}
      - name: Enviar para a branch gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
